name: Custom firmware build

# On-demand per-app firmware builder for the applab catalog.
#
# Triggered by the applab site (via a small proxy that calls the GitHub API with a
# repository_dispatch of type "custom-build"), or manually for testing.
#
# SAFETY:
#   * The variant is FORCED to "public" — this service must NEVER hand out the
#     private car-key firmware. `FLIPPER_APPS` can only NARROW the public app set
#     (fam_config applies it after the public/board filters), so it can't re-add
#     stripped apps either.
#   * `build_id` is sanitized to [a-z0-9-] before it's used as a path.
#
# PREREQUISITES (one-time setup):
#   * This (private) repo must contain the full firmware source.
#   * A SEPARATE PUBLIC repo hosts the built bins over Pages, e.g.
#     stonervpn-design/applab-builds  (Settings -> Pages -> main / root).
#   * Repo secret BUILDS_REPO_TOKEN = a fine-grained PAT with Contents:write on
#     the applab-builds repo.
#   * Repo variable BUILDS_REPO = "stonervpn-design/applab-builds".
#   * For the M5Stick S3 (SD-less) the pre-baked /ext image lives at
#     ci/ext_m5stick_s3.bin (same sd_content baked once; app choice doesn't change it).

on:
  workflow_dispatch:
    inputs:
      board:
        description: "m5stick_s3 | m5stack_cardputer_adv | lilygo_t_embed_cc1101"
        required: true
        default: "m5stack_cardputer_adv"
      apps:
        description: "Comma-separated appids to include (empty = full public set)"
        required: false
        default: ""
      build_id:
        description: "Unique id for this build (used as the output folder)"
        required: true
      flavor:
        description: "unleashed | momentum"
        required: false
        default: "unleashed"
  repository_dispatch:
    types: [custom-build]

concurrency:
  group: custom-build-${{ github.event.client_payload.build_id || inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    # A cold-cache full-app build (every app selected) can run well past 40 min,
    # especially for the larger Momentum sets; 40 was killing those mid-compile.
    timeout-minutes: 90
    env:
      # ccache: repeat custom builds share almost all object files (only the app
      # SET differs), so a warm cache turns a full recompile into an incremental one.
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v5
        with:
          # Momentum flavor builds from the `momentum` branch (a mirror of the
          # momentum-mob tree, which carries the same FLIPPER_VARIANT=public +
          # FLIPPER_APPS machinery). Empty ref => default branch = the Unleashed tree.
          ref: ${{ (github.event.client_payload.flavor == 'momentum' || github.event.inputs.flavor == 'momentum') && 'momentum' || '' }}

      - name: Resolve & validate inputs
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          BOARD="${{ github.event.client_payload.board || inputs.board }}"
          APPS="${{ github.event.client_payload.apps || inputs.apps }}"
          BID="${{ github.event.client_payload.build_id || inputs.build_id }}"
          FLAVOR="${{ github.event.client_payload.flavor || inputs.flavor }}"
          [ -n "$FLAVOR" ] || FLAVOR="unleashed"

          # board allowlist
          case "$BOARD" in
            m5stick_s3|m5stack_cardputer_adv|lilygo_t_embed_cc1101) ;;
            *) echo "::error::unknown board '$BOARD'"; exit 1 ;;
          esac
          # flavor allowlist
          case "$FLAVOR" in
            unleashed|momentum) ;;
            *) echo "::error::unknown flavor '$FLAVOR'"; exit 1 ;;
          esac
          # build_id: keep only safe chars, cap length (no path traversal)
          BID="$(printf '%s' "$BID" | tr -cd 'a-zA-Z0-9-' | cut -c1-40)"
          [ -n "$BID" ] || { echo "::error::empty build_id"; exit 1; }
          # apps: keep only appid-safe chars and commas
          APPS="$(printf '%s' "$APPS" | tr -cd 'a-zA-Z0-9_,-')"

          case "$BOARD" in
            m5stick_s3)
              SDKDEF="sdkconfig.defaults;sdkconfig.defaults.m5stick_s3"
              NAME="applab M5Stick S3 (custom)"; FLASHSIZE="8MB" ;;
            lilygo_t_embed_cc1101)
              SDKDEF="sdkconfig.defaults;sdkconfig.defaults.lilygo_t_embed_cc1101"
              NAME="applab T-Embed CC1101+ (custom)"; FLASHSIZE="16MB" ;;
            *)
              SDKDEF="sdkconfig.defaults;sdkconfig.defaults.m5stack_cardputer_adv"
              NAME="applab Cardputer ADV (custom)"; FLASHSIZE="8MB" ;;
          esac
          # Momentum builds are labelled so the flasher UI shows which flavor it is.
          if [ "$FLAVOR" = "momentum" ]; then NAME="$NAME [Momentum]"; fi
          {
            echo "board=$BOARD"; echo "apps=$APPS"; echo "bid=$BID"
            echo "sdkdef=$SDKDEF"; echo "name=$NAME"; echo "flashsize=$FLASHSIZE"
            echo "flavor=$FLAVOR"
          } >> "$GITHUB_OUTPUT"
          echo "Building $BOARD (public, $FLAVOR) id=$BID apps=[$APPS]"

      - name: Cache compiled objects (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # run_id makes the primary key unique so the cache is always re-saved with
          # this build's fresh objects; restore-keys warm it from the latest prior run.
          key: ccache-custom-${{ steps.cfg.outputs.board }}-${{ github.run_id }}
          restore-keys: |
            ccache-custom-${{ steps.cfg.outputs.board }}-
            ccache-custom-

      - name: Build firmware (public variant, selected apps)
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          # ccache must be on PATH for idf.py's IDF_CCACHE_ENABLE to take effect.
          command -v ccache >/dev/null || { apt-get update -qq && apt-get install -y -qq ccache; }
          mkdir -p "$CCACHE_DIR"
          ccache -z >/dev/null 2>&1 || true
          # The app-icon generator (tools/fam/compile_icons.py) needs Pillow, which
          # isn't in the esp-idf container image.
          pip install --quiet pillow
          export FLIPPER_BOARD="${{ steps.cfg.outputs.board }}"
          export FLIPPER_VARIANT="public"                      # forced — never private
          export FLIPPER_APPS="${{ steps.cfg.outputs.apps }}"  # narrows the public set
          rm -f sdkconfig
          # Tee the whole build so a failure can be published for diagnosis
          # (pipefail keeps idf.py's exit code even though tee succeeds).
          idf.py -B build \
            -DIDF_TARGET=esp32s3 \
            -DFLIPPER_BOARD="${{ steps.cfg.outputs.board }}" \
            -DFLIPPER_VARIANT=public \
            -DSDKCONFIG_DEFAULTS="${{ steps.cfg.outputs.sdkdef }}" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build_output.log"
          echo "=== ccache stats (this build) ==="; ccache -s 2>/dev/null || true

      - name: Merge single-file image
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          B=build
          COMMON=( --chip esp32s3 merge_bin --flash_mode dio --flash_size ${{ steps.cfg.outputs.flashsize }} --flash_freq 80m )
          BASE=( 0x0    "$B/bootloader/bootloader.bin"
                 0x8000 "$B/partition_table/partition-table.bin"
                 0x10000 "$B/furi_esp32.bin" )
          if [ "${{ steps.cfg.outputs.board }}" = "m5stick_s3" ]; then
            # SD-less board: the /ext FAT image is baked into flash. Publish TWO images:
            #  firmware.bin      = full (bootloader+app+ext) for a fresh install
            #  firmware-app.bin  = app only, for a fast reflash that KEEPS the /ext data
            test -f ci/ext_m5stick_s3.bin || { echo "::error::missing ci/ext_m5stick_s3.bin"; exit 1; }
            python -m esptool "${COMMON[@]}" -o firmware-app.bin "${BASE[@]}"
            python -m esptool "${COMMON[@]}" -o firmware.bin     "${BASE[@]}" 0x390000 ci/ext_m5stick_s3.bin
            ls -l firmware.bin firmware-app.bin
          else
            # SD-based boards read data from microSD; the single image is already app-only.
            python -m esptool "${COMMON[@]}" -o firmware.bin "${BASE[@]}"
            ls -l firmware.bin
          fi

      - name: Publish to the public builds repo
        shell: bash
        env:
          TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          BUILDS_REPO: ${{ vars.BUILDS_REPO }}
        run: |
          set -euo pipefail
          BID="${{ steps.cfg.outputs.bid }}"
          NAME="${{ steps.cfg.outputs.name }}"
          BOARD="${{ steps.cfg.outputs.board }}"
          test -n "$TOKEN" || { echo "::error::BUILDS_REPO_TOKEN not set"; exit 1; }
          test -n "$BUILDS_REPO" || { echo "::error::BUILDS_REPO var not set"; exit 1; }
          test -f firmware.bin || { echo "::error::firmware.bin missing"; exit 1; }
          FW="$PWD/firmware.bin"
          # M5Stick also ships an app-only image for fast "firmware only" reflashes.
          APPFW=""
          if [ "$BOARD" = "m5stick_s3" ] && [ -f firmware-app.bin ]; then APPFW="$PWD/firmware-app.bin"; fi
          git config --global user.email "ci@applab"
          git config --global user.name "applab-ci"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BUILDS_REPO}.git" out
          cd out
          # Manifest is identical across retries; build it once.
          MANIFEST=$(cat <<JSON
          {
            "name": "$NAME",
            "version": "$BID",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "firmware.bin", "offset": 0 } ] }
            ]
          }
          JSON
          )
          # Firmware-only manifest (M5Stick fast reflash): app image, no full erase, so
          # the device's existing /ext data (SubGHz/NFC/IR) survives.
          MANIFEST_APP=$(cat <<JSON
          {
            "name": "$NAME (firmware only)",
            "version": "$BID",
            "new_install_prompt_erase": false,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "firmware-app.bin", "offset": 0 } ] }
            ]
          }
          JSON
          )
          # Concurrent custom-builds push to this SHARED repo. Each build writes a UNIQUE
          # builds/$BID/ path, so there is never a content conflict -- but a plain push
          # still races (the second pusher is rejected non-fast-forward). Rebasing a
          # --depth 1 clone is fragile: once main advances past the shallow boundary the
          # rebase can't find a merge base and every retry fails. Instead, re-apply our
          # unique files onto the freshly-fetched tip each attempt and fast-forward push.
          # Capture the linker memory summary so RAM/flash headroom is visible
          # per build (published as size.txt) -- lets us diagnose RAM issues
          # like M5Stick reboots without a device.
          SIZEFILE="$RUNNER_TEMP/size.txt"
          { echo "build_id: $BID  board: $BOARD  apps: ${{ steps.cfg.outputs.apps }}";
            grep -iE "Total sizes|Used .*RAM|Used Flash|remaining" \
              "$GITHUB_WORKSPACE/build_output.log" 2>/dev/null | tail -20; } > "$SIZEFILE" || true

          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth 1 origin main
            git reset -q --hard origin/main
            mkdir -p "builds/$BID"
            cp "$FW" "builds/$BID/firmware.bin"
            cp "$SIZEFILE" "builds/$BID/size.txt" 2>/dev/null || true
            printf '%s\n' "$MANIFEST" > "builds/$BID/manifest.json"
            if [ -n "$APPFW" ]; then
              cp "$APPFW" "builds/$BID/firmware-app.bin"
              printf '%s\n' "$MANIFEST_APP" > "builds/$BID/manifest-app.json"
            fi
            git add -A
            if git diff --cached --quiet; then pushed=1; echo "already published ($BID)"; break; fi
            git commit -q -m "custom build $BID ($BOARD)"
            if git push -q origin HEAD:main; then pushed=1; echo "pushed on attempt $attempt"; break; fi
            echo "push rejected (another build pushed first); refetch + retry ($attempt)"
            sleep $(( (RANDOM % 4) + 1 ))
          done
          [ "$pushed" = 1 ] || { echo "::error::publish push failed after retries"; exit 1; }
          echo "Published: https://$(echo "$BUILDS_REPO" | cut -d/ -f1).github.io/$(echo "$BUILDS_REPO" | cut -d/ -f2)/builds/$BID/manifest.json"

      - name: Publish build error on failure (diagnostics)
        # A failed custom build otherwise publishes nothing, so the cause is
        # invisible outside the private Actions log. Push a trimmed build log to
        # the public builds repo at builds/<id>/error.log so failures are debuggable.
        if: failure()
        shell: bash
        env:
          TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          BUILDS_REPO: ${{ vars.BUILDS_REPO }}
        run: |
          set -uo pipefail
          BID="${{ steps.cfg.outputs.bid }}"
          BOARD="${{ steps.cfg.outputs.board }}"
          [ -n "$BID" ] || { echo "no build_id resolved; skipping error publish"; exit 0; }
          [ -n "${TOKEN:-}" ] && [ -n "${BUILDS_REPO:-}" ] || { echo "no publish creds; skipping"; exit 0; }
          {
            echo "applab custom build FAILED"
            echo "build_id: $BID"
            echo "board:    ${BOARD:-?}"
            echo "run:      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "===== build_output.log (tail) ====="
            tail -c 24000 "$GITHUB_WORKSPACE/build_output.log" 2>/dev/null \
              || echo "(no build output captured; failure was before or at the build step)"
          } > "$RUNNER_TEMP/error.log"
          git config --global user.email "ci@applab"
          git config --global user.name "applab-ci"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BUILDS_REPO}.git" errout || exit 0
          cd errout
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main
            git reset -q --hard origin/main
            mkdir -p "builds/$BID"
            cp "$RUNNER_TEMP/error.log" "builds/$BID/error.log"
            git add -A
            if git diff --cached --quiet; then echo "error.log already present"; break; fi
            git commit -q -m "custom build $BID FAILED ($BOARD) - error log"
            if git push -q origin HEAD:main; then echo "error log published"; break; fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "error log: https://$(echo "$BUILDS_REPO" | cut -d/ -f1).github.io/$(echo "$BUILDS_REPO" | cut -d/ -f2)/builds/$BID/error.log"
